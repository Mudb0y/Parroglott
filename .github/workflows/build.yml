name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # The version code is the commit count, and dev builds name the last tag.
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31

      - name: Cache firmware
        uses: actions/cache@v6
        with:
          path: work/firmware
          key: firmware-${{ hashFiles('scripts/fetch-firmware.sh') }}

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.kts', 'android/gradle.properties') }}

      - name: Fetch firmware
        run: nix develop --command scripts/fetch-firmware.sh

      - name: Version
        run: |
          count=$(git rev-list --count HEAD)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
              name=${GITHUB_REF_NAME#v}
              file=Parroglott-$name.apk
          else
              last=$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null || echo v0.1.0)
              name=${last#v}-dev.$count+$(git rev-parse --short HEAD)
              file=Parroglott-dev.apk
          fi
          echo "PARROGLOTT_VERSION_CODE=$count" >> "$GITHUB_ENV"
          echo "PARROGLOTT_VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "APK=$file" >> "$GITHUB_ENV"
          echo "Version $name, code $count"

      - name: Signing key
        id: key
        env:
          KEYSTORE: ${{ secrets.PARROGLOTT_KEYSTORE }}
          PROPERTIES: ${{ secrets.PARROGLOTT_SIGNING_PROPERTIES }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$PROPERTIES" ]; then
              echo "::warning::No signing secrets; building with a throwaway key and not publishing."
              exit 0
          fi
          dir=$RUNNER_TEMP/signing
          mkdir -p "$dir"
          base64 -d <<< "$KEYSTORE" > "$dir/release.jks"
          printf '%s\n' "$PROPERTIES" > "$dir/signing.properties"
          echo "PARROGLOTT_SIGNING=$dir/signing.properties" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: |
          nix develop --command scripts/stage-android.sh
          nix develop --command bash -c 'cd android && gradle --no-daemon --console=plain assembleRelease'
          mv android/app/build/outputs/apk/release/app-release.apk "$APK"

      # What the app's updater reads: a fixed address per channel, the APK's
      # checksum, and the changes since the build this channel last published.
      - name: Update file
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
              tag=$GITHUB_REF_NAME
              since=$(git describe --tags --match 'v*' --abbrev=0 "$tag^" 2> /dev/null || true)
          else
              tag=dev
              since=$(git rev-parse -q --verify refs/tags/dev || true)
          fi
          git log --no-merges --format=%s ${since:+$since..}HEAD | head -40 > notes.txt
          [ -s notes.txt ] || git log -1 --format=%s > notes.txt
          jq -n --argjson code "$PARROGLOTT_VERSION_CODE" --arg name "$PARROGLOTT_VERSION_NAME" \
              --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$APK" \
              --argjson size "$(stat -c %s "$APK")" --arg sha256 "$(sha256sum "$APK" | cut -d' ' -f1)" \
              --rawfile notes notes.txt \
              '{code: $code, name: $name, url: $url, size: $size, sha256: $sha256,
                notes: ($notes | split("\n") | map(select(length > 0)))}' > update.json
          sed 's/^/- /' notes.txt > release-notes.md
          cat update.json

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APK }}
          path: ${{ env.APK }}

      - name: Release
        if: steps.key.outputs.signed == 'true' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$APK" update.json --verify-tag --title "Parroglott $PARROGLOTT_VERSION_NAME" --notes-file release-notes.md

      - name: Development build
        if: steps.key.outputs.signed == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev --yes --cleanup-tag 2> /dev/null || true
          gh release create dev "$APK" update.json --prerelease --target "$GITHUB_SHA" \
              --title "Development build $PARROGLOTT_VERSION_NAME" \
              --notes "Built from main at $(git rev-parse --short HEAD): $(git log -1 --format=%s). It installs over any earlier development build or tagged release."
